# =====================================================================
#  era.yml — паспорт эпохи. Скопируйте папку _template целиком,
#  переименуйте (например в rome_117ad) и заполните этот файл.
#
#  Всё, что ниже — обычный текст. Кавычки и отступы сохраняйте.
# =====================================================================

# Короткое машинное имя эпохи = имя папки. Только латиница, цифры, подчёркивание.
# По нему называется файл тайлов: tiles/era-<id>.pmtiles
id: bc323

# Как эпоха подписана в интерфейсе сайта.
name_ru: "Мир в 323 году до н. э."
name_short_ru: "323 до н. э."

# Опорный год снимка. Отрицательное число = до нашей эры.
year: -323

# Диапазон лет, в котором этот снимок считается верным.
# Ползунок времени между соседними эпохами будет плавно переключаться
# на ближайший снимок — это нормальная практика для исторических карт.
valid_from: -330
valid_to: -301

# Географический охват снимка: мир целиком или один регион.
# world | europe | mediterranean | near_east | south_asia | east_asia |
# africa | americas | oceania
scope: world        # world | europe | mediterranean | near_east | south_asia | east_asia

# Если scope не world — ограничивающий прямоугольник [запад, юг, восток, север].
# Для world оставьте null.
bbox: null

# До какого зума строить тайлы. ЗАМЕРЕНО НА ДЕМО (88 объектов, 13 916 вершин):
#   4 → 175 КБ   5 → 335 КБ   6 → 692 КБ   7 → 1,5 МБ   8 → 3,3 МБ
# КАЖДЫЙ ЛИШНИЙ ЗУМ УДВАИВАЕТ ВЕС. Упрощение геометрии почти не помогает.
# Для мирового снимка достаточно 6; детальность «до Колизея» делается
# отдельным региональным файлом в maps/poi/, а не здесь.
maxzoom: 6

# С какой прозрачностью рисовать заливку государств (0.0 – 1.0).
fill_opacity: 0.55

# ---------------------------------------------------------------------
#  ИСТОЧНИКИ. Заполняйте честно: это и ваша научная добросовестность,
#  и защита от лицензионных проблем через год.
# ---------------------------------------------------------------------

# ---------------------------------------------------------------------
# ГДЕ ИСКАТЬ ПЛАНЕТАРНЫЙ ДАМП OHM (нужно для tools/extract_era.py)
# Порядок поиска: это поле → переменная окружения OHM_PLANET → ~/ohm/planet.osm.pbf
# Свежая ссылка всегда здесь (открывать по https, вариант s3.amazonaws.com даёт 403):
#   curl -s https://planet.openhistoricalmap.org/planet/state.txt
# Размер ~1,3 ГБ, лицензия CC0 — можно использовать коммерчески без ограничений.
# ---------------------------------------------------------------------
ohm_planet: "~/ohm/planet.osm.pbf"

# ---------------------------------------------------------------------
# ЧТО ДОЛЖНО БЫТЬ НА ЭТОЙ ЭПОХЕ.
# Это единственная часть отчёта, которую нельзя автоматизировать:
# инструмент не может догадаться, чего в данных НЕТ. Заполняете вы по
# справочнику или атласу — дальше extract_era.py сам сверит и покажет дыры.
#
# Давайте 2–3 варианта написания: в OHM Египет Древнего царства лежит как
# «Kemet», а Индская цивилизация как «Indus Valley Civilisation», поэтому
# по одному только русскому названию сопоставление не сработает.
# ---------------------------------------------------------------------
expected:
  - {ru: "Название по-русски", variants: ["English name", "Local name", "Q-номер"]}
  # - {ru: "Древнее царство Египта", variants: ["Kemet", "Old Kingdom", "Egypt"]}
  # - {ru: "Элам", variants: ["Elam"]}

sources:
  - name: "aourednik/historical-basemaps, world_bc323.geojson"
    url: "https://github.com/aourednik/historical-basemaps"
    license: "GPL-3.0 (ВНИМАНИЕ: см. раздел 8 плана; использовать как visual reference)"
    used_for: "каркас границ — в демо"

  - name: "Natural Earth 1:110m admin-0"
    url: "https://www.naturalearthdata.com/"
    license: "public domain"
    used_for: "современная подложка и береговая линия"

  - name: "Barrington Atlas of the Greek and Roman World"
    url: ""
    license: "печатный атлас — только сверка, не копирование"
    used_for: "проверка границ эллинистических государств"

# Комментарий для пользователя сайта (показывается в плашке «О карте»).
disclaimer_ru: >
  Границы древних государств приблизительны и отражают состояние
  историографии, а не результат точных измерений. Зоны пограничья
  показаны как области влияния, а не как линии контроля.
