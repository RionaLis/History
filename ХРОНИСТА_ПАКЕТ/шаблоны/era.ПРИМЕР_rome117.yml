# =====================================================================
#  era.yml — РИМСКАЯ ИМПЕРИЯ В 117 ГОДУ Н. Э.
#  Максимальное расширение: Траян только что присоединил Армению,
#  Ассирию и Месопотамию. Пилотная эпоха проекта.
# =====================================================================

id: rome117
name_ru: "Римская империя в 117 году н. э."
name_short_ru: "117 н. э."

year: 117
valid_from: 115
valid_to: 119

# Эпоха МИРОВАЯ: берём всю Землю.
scope: world

# bbox НЕ ЗАДАНА намеренно.
# Рамка нужна только для прицельного фрагмента региона. Для мировой карты она
# вредна: отсекает то, что к эпохе относится. Проверено на себе — с рамкой
# 20,5,78,42 из ближневосточного среза −2400 выпадала культура колоколовидных
# кубков (Испания), хотя для мировой карты она нужна.
# Заполните [запад, юг, восток, север], только если делаете региональный срез.
# bbox: [-12, 22, 62, 60]

ohm_planet: "~/ohm/planet.osm.pbf"

# Мировой снимок на z0–6 (~1,5 МБ). Деталь Рима — отдельным региональным
# файлом maps/poi/rome/ на z10–14, а не здесь.
maxzoom: 6

# ---------------------------------------------------------------------
# ЧТО ДОЛЖНО БЫТЬ НА ЭТОЙ КАРТЕ.
# Единственная часть, которую нельзя автоматизировать: инструмент не может
# догадаться, чего в данных НЕТ.
#
# Варианты написания обязательны: в OHM Римская империя может лежать как
# «Regnum Romanum», «Imperium Romanum» или «Roman Empire».
#
# Q-номера здесь НЕ проставлены намеренно: их надо проверять через
# tools/wd_lookup.py, а не писать по памяти. Один раз я взял Q189058 для
# Гавгамел — это оказался Целлинген в Баварии.
# ---------------------------------------------------------------------
expected:
  # --- сама империя и её провинции ---
  - {ru: "Римская империя",            variants: ["Imperium Romanum", "Roman Empire", "Regnum Romanum", "Roma"]}
  - {ru: "Рим",                        variants: ["Roma", "Rome"]}
  - {ru: "Италия",                     variants: ["Italia"]}
  - {ru: "Британия",                   variants: ["Britannia"]}
  - {ru: "Галлия",                     variants: ["Gallia"]}
  - {ru: "Испания",                    variants: ["Hispania"]}
  - {ru: "Дакия",                      variants: ["Dacia"]}
  - {ru: "Мёзия",                      variants: ["Moesia"]}
  - {ru: "Паннония",                   variants: ["Pannonia"]}
