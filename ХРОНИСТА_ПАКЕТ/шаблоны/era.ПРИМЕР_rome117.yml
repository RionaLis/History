  - {ru: "Вифиния и Понт",             variants: ["Bithynia", "Pontus"]}
  # --- пограничные провинции Траяна, самые свежие на эту дату ---
  - {ru: "Армения",                    variants: ["Armenia", "Armenia Magna"]}
  - {ru: "Месопотамия",                variants: ["Mesopotamia"]}
  - {ru: "Ассирия",                    variants: ["Assyria", "Assyria (Roman province)"]}
  # --- соседи: без них граница нечитаемa ---
  - {ru: "Парфия",                     variants: ["Parthia", "Parthian Empire", "Arsacid"]}
  - {ru: "Кушанское царство",          variants: ["Kushan", "Kushan Empire"]}
