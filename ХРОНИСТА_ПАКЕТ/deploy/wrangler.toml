# =====================================================================
#  wrangler.toml — настройки Cloudflare Worker'а.
#
#  Замените ДВЕ строки перед публикацией:
#    1. name          — имя Worker'а. Оно станет частью адреса:
#                       https://<name>.<ваш-аккаунт>.workers.dev
#                       Только латинские буквы, цифры и дефис.
#    2. bucket_name   — имя корзины R2, которую вы создадите командой
#                       npx wrangler r2 bucket create chrono-tiles
#
#  account_id можно не заполнять: при первом запуске wrangler спросит его
#  сам и запомнит. Если хотите вписать сразу — возьмите его на
#  dash.cloudflare.com → главная страница → справа «Account ID».
# =====================================================================

name = "chrono-mapa"
main = "worker.js"
compatibility_date = "2025-01-01"

# account_id = "ВАШ_ACCOUNT_ID"

# ---------------------------------------------------------------------
#  Привязка к корзине R2. В коде worker.js она доступна как env.BUCKET.
# ---------------------------------------------------------------------
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "chrono-tiles"

# ---------------------------------------------------------------------
#  Бесплатный тариф Workers. Явно указываем, чтобы wrangler не предложил
#  платный план по умолчанию.
# ---------------------------------------------------------------------
[placement]
mode = "smart"

# ---------------------------------------------------------------------
#  Журнал. Бесплатный, но по умолчанию выключен; включите, если понадобится
#  посмотреть, что именно Worker отвечал на запросы.
# ---------------------------------------------------------------------
[observability]
enabled = true

# =====================================================================
#  Про лимит в 1 МБ — ВАЖНО
# =====================================================================
# На бесплатном тарифе ВЕСЬ код Worker'а вместе с подключаемыми модулями
# должен влезать в 1 МБ. Этот файл весит около 7 КБ, так что запас огромный.
#
# Но именно поэтому библиотека MapLibre (1 056 837 байт) НЕ кладётся в R2
# и НЕ раздаётся этим Worker'ом — она одна съела бы весь лимит. Она
# подключается с CDN: tools/make_public.py подменяет в index.html строки
#
#     <link rel="stylesheet" href="maplibre-gl.css">
#     <script src="maplibre-gl.js"></script>
#
# на
#
#     https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css
#     https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js
#
# Проверено 22.10.2026: jsdelivr отдаёт файл ровно того же размера, что и
# ваш локальный maplibre-gl.js — байт в байт, версия совпадает.
#
# Плата за это: если jsdelivr недоступен, карта не откроется. Для платного
# продукта библиотеку надо будет положить к себе — но тогда её раздаёт НЕ
# Worker, а R2 через публичный доступ или отдельный хостинг, чтобы не
# упираться в лимит кода.
