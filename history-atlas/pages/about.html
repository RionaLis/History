<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>О проекте — Хронолента</title>
<link rel="stylesheet" href="../assets/css/main.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%23283044'/><rect x='2' y='3' width='12' height='2' fill='%23e0a96d'/><rect x='2' y='7' width='9' height='2' fill='%2366bb6a'/><rect x='2' y='11' width='6' height='2' fill='%234dd0e1'/></svg>">
</head>
<body>
<div id="top"></div>
<div class="page"><div class="page-inner">
  <div class="article" id="art">Загрузка…</div>
  <div class="cards" id="stats" style="margin-top:18px"></div>
</div></div>
<script type="module">
import { loadData, topbar, BASE, $ } from '../assets/js/pages.js';
import { renderMarkdown, stripFrontmatter } from '../assets/js/md.js';
const data = await loadData();
$('#top').innerHTML = topbar('О проекте');
const md = await (await fetch(BASE + 'content/articles/about.md', { cache: 'no-cache' })).text();
$('#art').innerHTML = renderMarkdown(stripFrontmatter(md).body);
const c = data.meta.counts;
const items = [['Макро-регионов', c.regions], ['Суб-регионов (дорожек)', c.lanes],
  ['Народов и государств', c.entities], ['Событий', c.events],
  ['Линий переселений', c.migrations], ['Эпох', c.eras]];
$('#stats').innerHTML = items.map(([k, v]) =>
  `<div class="card"><h3>${v}</h3><p class="tagline">${k}</p></div>`).join('');
</script>
</body>
</html>
